name: Verify research foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: npm run verify
      - run: npm run build
      - run: node operations/scripts/check-production-release.mjs artifact
      - run: node operations/scripts/scan-secrets.mjs
