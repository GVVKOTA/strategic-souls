name: Verify research foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - name: Verify six-folder root layout and tracked hygiene
        working-directory: .
        run: node operations/scripts/check-repo-layout.mjs
      - name: Setup Node, pnpm, and dependencies
        uses: ./.github/actions/setup-app
        with:
          node-version: '24'
      - run: pnpm run verify
      - run: pnpm run build
      - working-directory: .
        run: |
          node operations/scripts/check-production-release.mjs artifact
          node operations/scripts/scan-secrets.mjs
          node operations/scripts/scan-v3-source.mjs
          node --test operations/scripts/check-repo-layout.test.mjs
